services:
  postgres:
    image: postgres:16-alpine
    container_name: truetone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: TrueTone
    ports:
      - "5432:5432"
    volumes:
      - postgres_truetone_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d TrueTone"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_truetone_data:
    driver: local

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrueTone | High-Performance Brand Tone Governance Platform</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- =================================================================== -->
        <!-- 1. PERSISTENT LEFT SIDEBAR                                         -->
        <!-- =================================================================== -->
        <aside class="sidebar" id="app-sidebar">
            <!-- Brand Logo -->
            <div class="brand">
                <div class="brand-icon">T</div>
                <div class="brand-text">
                    <h1>TrueTone</h1>
                    <span>Brand Governance</span>
                </div>
            </div>

            <!-- Demo Persona Switcher (For Hackathon & Role Verification) -->
            <div class="persona-switcher-box">
                <div class="sidebar-section-label">
                    <span>Demo Role Switcher</span>
                    <span style="font-size: 0.6rem; color: var(--text-muted);">HACKATHON MODE</span>
                </div>
                <select id="role-switcher-select" class="persona-select" title="Switch active persona to test conditional sidebar rendering">
                    <!-- Dynamically populated by app.js from DEMO_PERSONAS -->
                </select>
            </div>

            <!-- Compact User Profile Badge & Live Permissions -->
            <div class="user-profile-badge" id="user-profile-card">
                <div class="user-profile-header">
                    <div class="user-avatar" id="user-avatar-initials">SJ</div>
                    <div class="user-info">
                        <div class="user-name" id="user-profile-name">Sarah Jenkins</div>
                        <div class="user-designation" id="user-profile-designation">Senior Content Creator</div>
                    </div>
                </div>
                <div class="user-dept" id="user-profile-dept">Content & Creative Marketing</div>
                
                <!-- Live Permission Flags from PostgreSQL users table -->
                <div class="user-permissions-strip" title="Live permissions from PostgreSQL users table">
                    <span class="perm-pill active" id="perm-pill-post">POST: Y</span>
                    <span class="perm-pill inactive" id="perm-pill-approve">APPROVE: N</span>
                    <span class="perm-pill inactive" id="perm-pill-action">ACT: N</span>
                </div>
            </div>

            <!-- Role-Based Navigation Buttons Container -->
            <nav class="sidebar-nav" id="sidebar-nav-container">
                <div class="sidebar-section-label" style="padding: 0 4px; margin-bottom: 8px;">
                    <span>Navigation</span>
                </div>
                <ul id="sidebar-nav-list" class="nav-menu">
                    <!-- Conditionally rendered by app.js based on can_post, can_approve, can_take_action -->
                </ul>
            </nav>

            <!-- Sidebar Footer with Live PostgreSQL Health Indicator -->
            <div class="sidebar-footer">
                <div class="db-status-pill">
                    <div class="pulse-dot" id="db-health-dot"></div>
                    <div>
                        <strong id="db-health-status" style="font-size: 0.78rem;">PostgreSQL Pool</strong>
                        <div id="db-health-meta" style="font-size: 0.68rem; color: #64748b;">Checking health...</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- =================================================================== -->
        <!-- 2. MAIN CONTENT VIEWPORT                                           -->
        <!-- =================================================================== -->
        <main class="main-wrapper">
            <!-- App Top Header -->
            <header class="top-bar">
                <div class="top-bar-title">
                    <h2 id="page-title-text">Workspace</h2>
                </div>
                <div class="top-bar-meta">
                    <span class="role-tag-pill" id="top-bar-user-badge">User Profile</span>
                    <button class="btn-refresh" id="global-refresh-btn" title="Refresh current tab data from PostgreSQL">
                        <span>↻</span> Refresh
                    </button>
                </div>
            </header>

            <!-- Dynamic Workspace Content Viewport -->
            <!-- Each tab handler (publish_tab, guidelines_tab, reviews_tab, action_tab) clears & renders here -->
            <div id="main-workspace" class="workspace-viewport">
                <!-- Dynamically populated by tab handler functions -->
            </div>
        </main>
    </div>

    <!-- Generic Modal Dialog for Approvals / Enforcements / Payloads -->
    <div class="modal-overlay" id="generic-modal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modal-title">Dialog Title</h3>
                <button class="btn-close" id="modal-close-btn">&times;</button>
            </div>
            <div id="modal-content">
                <!-- Dynamically populated by openModal() -->
            </div>
        </div>
    </div>

    <!-- High-Contrast Toast Container -->
    <div id="toast-container"></div>

    <!-- Tab Modules (Defining exact function names) -->
    <script src="/js/tabs/publish.tab.js"></script>
    <script src="/js/tabs/guidelines.tab.js"></script>
    <script src="/js/tabs/reviews.tab.js"></script>
    <script src="/js/tabs/action.tab.js"></script>

    <!-- Legacy / Modular Components for full backend test compatibility -->
    <script src="/js/publish.tab.js"></script>
    <script src="/js/review.tab.js"></script>
    <script src="/js/logs.tab.js"></script>
    <script src="/js/actions.tab.js"></script>
    <script src="/js/users.tab.js"></script>

    <!-- Main Orchestrator -->
    <script src="/js/app.js"></script>
</body>
</html>

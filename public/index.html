<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrueTone | High-Performance Brand Tone Governance Platform</title>
    <link rel="stylesheet" href="/css/tokens.css?v=2.5">
    <link rel="stylesheet" href="/css/base.css?v=2.5">
    <link rel="stylesheet" href="/css/components.css?v=2.5">
    <link rel="stylesheet" href="/css/shell.css?v=2.5">
    <link rel="stylesheet" href="/css/publish.css?v=2.5">
    <link rel="stylesheet" href="/css/guidelines.css?v=2.5">
    <link rel="stylesheet" href="/css/reviews.css?v=2.5">
    <link rel="stylesheet" href="/css/actions.css?v=2.5">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Inline SVG Symbol Sprite for System Icons -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none;" aria-hidden="true">
        <symbol id="icon-publish" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
            <polyline points="16 6 12 2 8 6"/>
            <line x1="12" y1="2" x2="12" y2="15"/>
        </symbol>
        <symbol id="icon-guidelines" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
            <path d="M6 6h10"/>
            <path d="M6 10h10"/>
        </symbol>
        <symbol id="icon-reviews" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="8" height="4" x="8" y="2" rx="1" ry="1"/>
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
            <path d="m9 14 2 2 4-4"/>
        </symbol>
        <symbol id="icon-actions" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="M12 8v4"/>
            <path d="M12 16h.01"/>
        </symbol>
        <symbol id="icon-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
            <path d="M3 21v-5h5"/>
        </symbol>
        <symbol id="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
        </symbol>
    </svg>

    <div class="app-container">
        <!-- =================================================================== -->
        <!-- 1. PERSISTENT LEFT SIDEBAR                                         -->
        <!-- =================================================================== -->
        <aside class="sidebar" id="app-sidebar">
            <!-- Brand Logo -->
            <div class="brand">
                <div class="brand-icon" aria-hidden="true">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2" y="7" width="2.5" height="6" rx="1.25" fill="currentColor"/>
                        <rect x="6.5" y="3" width="2.5" height="14" rx="1.25" fill="currentColor"/>
                        <rect x="11" y="5.5" width="2.5" height="9" rx="1.25" fill="currentColor"/>
                        <rect x="15.5" y="8" width="2.5" height="4" rx="1.25" fill="currentColor"/>
                    </svg>
                </div>
                <div class="brand-text">
                    <h1>TrueTone</h1>
                    <span>Brand Governance</span>
                </div>
            </div>

            <!-- Demo Persona Switcher (Workspace Switcher Card) -->
            <div class="persona-switcher-box">
                <div class="sidebar-section-label">
                    <span>Viewing as</span>
                </div>
                <select id="role-switcher-select" class="persona-select"
                    title="Switch active persona to test conditional sidebar rendering"
                    aria-label="Demo Persona Switcher">
                    <!-- Dynamically populated by app.js from DEMO_PERSONAS -->
                </select>
            </div>

            <!-- Compact User Profile Badge & Live Permissions -->
            <div class="user-profile-badge" id="user-profile-card">
                <div class="user-profile-header">
                    <div class="user-avatar" id="user-avatar-initials">SJ</div>
                    <div class="user-info">
                        <div class="user-name" id="user-profile-name">Sarah Jenkins</div>
                        <div class="user-designation" id="user-profile-designation">Senior Content Creator</div>
                    </div>
                </div>
                <div class="user-dept" id="user-profile-dept">Content & Creative Marketing</div>

                <!-- Live Permission Flags from PostgreSQL users table -->
                <div class="user-permissions-strip" title="Live permissions from PostgreSQL users table">
                    <span class="perm-pill active" id="perm-pill-post">POST: Y</span>
                    <span class="perm-pill inactive" id="perm-pill-approve">APPROVE: N</span>
                    <span class="perm-pill inactive" id="perm-pill-action">ACT: N</span>
                </div>
            </div>

            <!-- Role-Based Navigation Buttons Container -->
            <nav class="sidebar-nav" id="sidebar-nav-container">
                <div class="sidebar-section-label">
                    <span>Navigation</span>
                </div>
                <ul id="sidebar-nav-list" class="nav-menu">
                    <!-- Conditionally rendered by app.js based on can_post, can_approve, can_take_action -->
                </ul>
            </nav>

            <!-- Sidebar Footer with Live PostgreSQL Health Indicator -->
            <div class="sidebar-footer">
                <div class="db-status-pill">
                    <div class="pulse-dot" id="db-health-dot"></div>
                    <div>
                        <strong id="db-health-status">PostgreSQL Pool</strong>
                        <div id="db-health-meta">Checking health...</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- =================================================================== -->
        <!-- 2. MAIN CONTENT VIEWPORT                                           -->
        <!-- =================================================================== -->
        <main class="main-wrapper">
            <!-- App Top Header -->
            <header class="top-bar">
                <div class="top-bar-title">
                    <h2 id="page-title-text">Workspace</h2>
                </div>
                <div class="top-bar-meta">
                    <span class="role-tag-pill" id="top-bar-user-badge">User Profile</span>
                    <button class="btn-refresh" id="global-refresh-btn"
                        title="Refresh current tab data from PostgreSQL"
                        aria-label="Refresh workspace data">
                        <svg class="btn-icon" width="14" height="14" aria-hidden="true"><use href="#icon-refresh"></use></svg>
                        <span>Refresh</span>
                    </button>
                </div>
            </header>

            <!-- Dynamic Workspace Content Viewport -->
            <!-- Each tab handler (publish_tab, guidelines_tab, reviews_tab, action_tab) clears & renders here -->
            <div id="main-workspace" class="workspace-viewport">
                <!-- Dynamically populated by tab handler functions -->
            </div>
        </main>
    </div>

    <!-- Generic Modal Dialog for Approvals / Enforcements / Payloads -->
    <div class="modal-overlay" id="generic-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modal-title">Dialog Title</h3>
                <button class="btn-close" id="modal-close-btn" aria-label="Close dialog">
                    <svg width="16" height="16" aria-hidden="true"><use href="#icon-close"></use></svg>
                </button>
            </div>
            <div id="modal-content">
                <!-- Dynamically populated by openModal() -->
            </div>
        </div>
    </div>

    <!-- High-Contrast Toast Container -->
    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <!-- Legacy / Modular Components for full backend test compatibility -->
    <script src="/js/publish.tab.js?v=2.5"></script>
    <script src="/js/review.tab.js?v=2.5"></script>
    <script src="/js/logs.tab.js?v=2.5"></script>
    <script src="/js/actions.tab.js?v=2.5"></script>
    <script src="/js/users.tab.js?v=2.5"></script>

    <!-- Tab Modules (Defining exact function names) -->
    <script src="/js/tabs/publish.tab.js?v=2.5"></script>
    <script src="/js/tabs/guidelines.tab.js?v=2.5"></script>
    <script src="/js/tabs/reviews.tab.js?v=2.5"></script>
    <script src="/js/tabs/action.tab.js?v=2.5"></script>

    <!-- Main Orchestrator -->
    <script src="/js/app.js?v=2.5"></script>
</body>

</html>
